[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidytable"
version = "1.0.0"
description = "Offline CSV/Excel cleaner, deduper and validator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<3.0", "openpyxl>=3.1,<4.0"]

[project.scripts]
tidytable = "tidytable.cli:main"

[tool.setuptools]
packages = ["tidytable"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
